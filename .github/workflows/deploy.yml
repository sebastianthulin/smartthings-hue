name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: |
          TEST_SCRIPT="$(node -p "require('./package.json').scripts?.test ?? ''")"
          if [ -n "$TEST_SCRIPT" ]; then
            npm test
          else
            echo "No tests configured; skipping."
          fi

      - name: Build production assets
        env:
          VITE_SMARTTHINGS_CLIENT_ID: ${{ secrets.VITE_SMARTTHINGS_CLIENT_ID }}
          VITE_SMARTTHINGS_BROKER_URL: ${{ secrets.VITE_SMARTTHINGS_BROKER_URL }}
          VITE_SMARTTHINGS_AUTHORIZE_URL: ${{ secrets.VITE_SMARTTHINGS_AUTHORIZE_URL }}
          VITE_SMARTTHINGS_SCOPES: ${{ secrets.VITE_SMARTTHINGS_SCOPES }}
        run: npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
